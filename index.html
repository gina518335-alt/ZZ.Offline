<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>성수동 매물 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard',sans-serif;height:100vh;display:flex;overflow:hidden;background:#f0ede8}

#sb{width:300px;min-width:300px;height:100vh;background:#fff;border-right:1px solid #e8e5e0;display:flex;flex-direction:column;overflow:hidden}
#sb-head{padding:16px 16px 12px;border-bottom:1px solid #f0ede8}
#sb-head h1{font-size:14px;font-weight:600;letter-spacing:-.3px;color:#111}
#sb-head p{font-size:11px;color:#bbb;margin-top:2px}

#tabs{display:flex;border-bottom:1px solid #f0ede8}
.tab{flex:1;padding:10px 4px;font-size:12px;color:#bbb;text-align:center;cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;font-family:inherit;transition:all .15s}
.tab.on{color:#111;border-bottom-color:#111;font-weight:500}
.panel{display:none;flex-direction:column;flex:1;overflow:hidden}
.panel.on{display:flex}

#p-pin{flex:1;display:flex;flex-direction:column;overflow:hidden}
#srch-wrap{padding:10px 12px 8px;border-bottom:1px solid #f0ede8}
#srch-row{display:flex;gap:6px}
#srch-inp{flex:1;background:#f7f5f2;border:1px solid #e8e5e0;border-radius:7px;padding:7px 10px;font-size:12px;outline:none;font-family:inherit}
#srch-inp:focus{border-color:#ccc;background:#fff}
#srch-inp::placeholder{color:#bbb}
#srch-btn{padding:7px 11px;background:#111;border:none;border-radius:7px;color:#fff;font-size:12px;cursor:pointer;font-family:inherit}
#srch-btn:hover{background:#333}
#srch-btn:disabled{background:#ccc;cursor:not-allowed}
#srch-st{font-size:11px;color:#bbb;margin-top:4px;min-height:14px;padding:0 2px}
#srch-res{margin-top:4px}
.sri{padding:7px 10px;background:#f7f5f2;border:1px solid #eeebe6;border-radius:6px;margin-bottom:3px;font-size:12px;cursor:pointer;line-height:1.4}
.sri:hover{background:#eeeae4}
.sri-name{font-weight:500;color:#111}
.sri-addr{font-size:10px;color:#aaa;margin-top:1px}

#list-wrap{flex:1;overflow-y:auto;padding:6px 10px 10px}
#list-wrap::-webkit-scrollbar{width:3px}
#list-wrap::-webkit-scrollbar-thumb{background:#e0dbd4;border-radius:4px}
.lbl{font-size:10px;color:#ccc;text-transform:uppercase;letter-spacing:1px;padding:8px 8px 3px}
.pc{border:1px solid #f0ede8;border-radius:8px;padding:9px 11px;margin-bottom:4px;cursor:pointer;background:#fff;transition:all .12s}
.pc:hover{background:#faf8f5;border-color:#dedad4}
.pc.on{border-color:#c8c4be;background:#faf8f5}
.pc-top{display:flex;align-items:center;gap:7px}
.pc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pc-name{font-size:12px;font-weight:500;color:#111;flex:1}
.pc-sz{font-size:11px;color:#ccc}
.pc-x{font-size:14px;color:#bbb;cursor:pointer;padding-left:6px;line-height:1}
.pc-x:hover{color:#e24b4a}
.pc-pr{margin-top:4px;font-size:11px;color:#bbb;padding-left:15px}
.pc-pr span{color:#888;font-weight:500}
.rc{border:1px dashed #e8e5e0;border-radius:8px;padding:8px 11px;margin-bottom:4px;cursor:pointer;background:#fafafa;transition:all .12s}
.rc:hover{background:#f5f3f0;border-color:#ccc}
.rc.on{border-color:#bbb}
.rc-top{display:flex;align-items:center;gap:7px}
.rc-ring{width:9px;height:9px;border-radius:50%;border:2px solid #aaa;flex-shrink:0}
.rc-name{font-size:12px;color:#888;flex:1}
.rc-x{font-size:14px;color:#bbb;cursor:pointer;padding-left:6px}
.rc-x:hover{color:#e24b4a}
#pin-hint{padding:8px 12px;border-top:1px solid #f0ede8;font-size:11px;color:#ccc;line-height:1.7}
#pin-hint b{color:#aaa;font-weight:500}

#p-draw{padding:12px;gap:8px;overflow-y:auto}
.dlbl{font-size:10px;color:#bbb;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;margin-top:2px}
.trg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.tr{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1.5px solid #f0ede8;border-radius:7px;cursor:pointer;background:#fff;transition:all .12s}
.tr-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tr-lbl{font-size:12px;color:#444;flex:1}
.dbtns{display:flex;gap:6px;margin-bottom:10px}
.dbtn{flex:1;padding:10px 6px;border:1.5px solid #e8e5e0;border-radius:8px;background:#fff;font-size:11px;color:#888;cursor:pointer;font-family:inherit;text-align:center;transition:all .12s;line-height:1.5}
.dbtn:hover{border-color:#ccc;background:#faf8f5;color:#333}
.dbtn.on{background:#111;color:#fff;border-color:#111}
.dbtn-icon{font-size:17px;display:block;margin-bottom:2px}
#dhint{background:#f7f5f2;border:1px solid #e8e5e0;border-radius:8px;padding:9px 11px;font-size:11px;color:#999;line-height:1.7}
#dhint b{color:#666;font-weight:500}
.plc-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid #f0ede8;border-radius:7px;margin-bottom:4px;background:#fff;font-size:12px}
.plc-line{width:20px;height:3px;border-radius:2px;flex-shrink:0}
.plc-area{width:15px;height:13px;border-radius:3px;flex-shrink:0;opacity:.55}
.plc-name{flex:1;color:#333}
.plc-x{font-size:13px;color:#bbb;cursor:pointer;padding-left:4px}
.plc-x:hover{color:#e24b4a}

#jbar{display:flex;gap:6px;padding:10px 12px;border-top:1px solid #f0ede8;background:#fff;flex-shrink:0}
.jbtn{flex:1;padding:8px 6px;background:#f7f5f2;border:1px solid #e8e5e0;border-radius:7px;font-size:11px;color:#666;cursor:pointer;font-family:inherit;transition:all .12s;font-weight:500}
.jbtn:hover{background:#eeeae4;border-color:#dedad4;color:#333}

#map{flex:1;height:100vh}
body.drawing .leaflet-container{cursor:crosshair!important}
#dtt{display:none;position:fixed;pointer-events:none;z-index:8000;background:#111;color:#fff;font-size:11px;padding:5px 10px;border-radius:6px;transform:translate(12px,-50%)}

.leaflet-popup-content-wrapper{background:#fff!important;border:1px solid #e8e5e0!important;border-radius:10px!important;box-shadow:0 4px 24px rgba(0,0,0,.1)!important;padding:0!important}
.leaflet-popup-tip{background:#fff!important}
.leaflet-popup-content{margin:0!important}
.pu{padding:13px 15px;min-width:190px;max-width:260px}
.pu-bar{width:100%;height:3px;border-radius:2px;margin-bottom:10px}
.pu-name{font-size:13px;font-weight:600;color:#111;margin-bottom:9px;line-height:1.35}
.pu-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f5f3f0}
.pu-row:last-of-type{border:none}
.pu-lbl{font-size:11px;color:#bbb}
.pu-val{font-size:11px;color:#444;font-weight:500}
.pu-memo{margin-top:8px;padding-top:8px;border-top:1px solid #f5f3f0;font-size:11px;color:#999;line-height:1.6;white-space:pre-wrap}
.pu-acts{display:flex;gap:5px;margin-top:8px}
.pu-btn{flex:1;padding:6px 4px;background:#f5f3f0;border:none;border-radius:5px;font-size:11px;color:#888;cursor:pointer;font-family:inherit}
.pu-btn.edit{background:#f0f4ff;color:#4A8FD9}
.pu-btn.edit:hover{background:#e0ecff}
.pu-btn.del:hover{background:#fdecea;color:#e24b4a}
.pu-ref-name{font-size:13px;font-weight:500;color:#555;margin-bottom:8px}
.pu-ref-note{font-size:11px;color:#aaa;margin-bottom:8px;line-height:1.5}

.leaflet-tooltip.plbl{background:rgba(255,255,255,.92);border:1px solid #ddd;border-radius:5px;padding:3px 8px;font-size:11px;font-weight:600;color:#333;box-shadow:0 1px 6px rgba(0,0,0,.1);white-space:nowrap;pointer-events:none}
.leaflet-tooltip.plbl::before{display:none}

.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:9999;align-items:center;justify-content:center}
.mo.on{display:flex}
.mb{background:#fff;border:1px solid #e8e5e0;border-radius:14px;padding:20px;width:330px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.12)}
.mb h2{font-size:14px;font-weight:600;color:#111;margin-bottom:14px}
.mf{margin-bottom:9px}
.mf label{display:block;font-size:11px;color:#aaa;margin-bottom:4px}
.mf input,.mf textarea{width:100%;background:#f7f5f2;border:1px solid #eeebe6;border-radius:7px;padding:7px 10px;color:#111;font-size:13px;outline:none;font-family:inherit;transition:border-color .15s}
.mf input:focus,.mf textarea:focus{border-color:#ccc;background:#fff}
.mf textarea{resize:vertical;min-height:70px}
.mbtns{display:flex;gap:7px;margin-top:14px}
.mbtns button{flex:1;padding:9px;border-radius:8px;font-size:13px;cursor:pointer;border:none;font-family:inherit;font-weight:500}
.btn-c{background:#f5f3f0;color:#999}
.btn-c:hover{background:#eeebe6}
.btn-s{background:#111;color:#fff}
.btn-s:hover{background:#333}
#mst{font-size:11px;color:#e24b4a;min-height:14px;margin-top:5px;text-align:center}
.type-toggle{display:flex;gap:5px;margin-bottom:12px}
.tt-btn{flex:1;padding:7px 4px;border:1.5px solid #eee;border-radius:7px;font-size:11px;cursor:pointer;text-align:center;background:#fff;color:#bbb;font-family:inherit;transition:all .12s}
.tt-btn.on{background:#111;color:#fff;border-color:#111}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:all .12s}
.sw:hover{transform:scale(1.1)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2.5px #333}
#imp-ta{width:100%;height:110px;background:#f7f5f2;border:1px solid #e8e5e0;border-radius:8px;padding:8px 10px;font-size:11px;color:#333;font-family:'Menlo','Consolas',monospace;resize:vertical;outline:none}
#imp-ta:focus{border-color:#ccc;background:#fff}
#imp-st{font-size:11px;min-height:14px;margin-top:5px;color:#e24b4a}
</style>
</head>
<body>

<div id="sb">
  <div id="sb-head">
    <h1>성수동 매물 지도</h1>
    <p>연무장길 · 서울숲 권역</p>
  </div>
  <div id="tabs">
    <button class="tab on" onclick="switchTab('pin')">📍 핀</button>
    <button class="tab"    onclick="switchTab('draw')">✏️ 장소</button>
  </div>

  <div class="panel on" id="p-pin">
    <div id="srch-wrap">
      <div id="srch-row">
        <input id="srch-inp" placeholder="주소 또는 우편번호(5자리)" onkeydown="if(event.key==='Enter')doSearch()"/>
        <button id="srch-btn" onclick="doSearch()">검색</button>
      </div>
      <div id="srch-st"></div>
      <div id="srch-res"></div>
    </div>
    <div id="list-wrap">
      <div class="lbl">매물</div>
      <div id="prop-list"></div>
      <div class="lbl" style="margin-top:6px">참고 지점</div>
      <div id="ref-list"></div>
    </div>
    <div id="pin-hint"><b>지도 클릭</b> 또는 <b>주소 검색</b>으로 핀을 찍어요</div>
  </div>

  <div class="panel" id="p-draw">
    <div class="dlbl">티어 선택</div>
    <div class="trg">
      <div class="tr" onclick="setDT(1)"><div class="tr-dot" style="background:#E24B4A"></div><span class="tr-lbl">1티어 — 연무장길 메인</span></div>
      <div class="tr" onclick="setDT(2)"><div class="tr-dot" style="background:#EF9F27"></div><span class="tr-lbl">2티어 — 랜드마크 인근</span></div>
      <div class="tr" onclick="setDT(3)"><div class="tr-dot" style="background:#aaa"></div><span class="tr-lbl">3티어 — 기타</span></div>
    </div>
    <div class="dlbl">그리기</div>
    <div class="dbtns">
      <button class="dbtn" id="btn-line" onclick="startDraw('line')"><span class="dbtn-icon">〰️</span>선 긋기<br><span style="font-size:10px;opacity:.7">연무장길 등</span></button>
      <button class="dbtn" id="btn-zone" onclick="startDraw('zone')"><span class="dbtn-icon">⬡</span>영역 그리기<br><span style="font-size:10px;opacity:.7">블록·구역</span></button>
    </div>
    <div id="dhint"><b>선</b> — 클릭으로 점 추가, <b>더블클릭</b>으로 완성<br><b>영역</b> — 꼭짓점 추가, <b>더블클릭</b>으로 완성</div>
    <div style="margin-top:10px">
      <div class="lbl">그린 장소</div>
      <div id="places-list"></div>
    </div>
  </div>

  <div id="jbar">
    <button class="jbtn" onclick="doExport()">⬇ 내보내기</button>
    <button class="jbtn" onclick="openImport()">⬆ 가져오기</button>
  </div>
</div>

<div id="map"></div>
<div id="dtt"></div>

<!-- PIN MODAL -->
<div id="m-pin" class="mo">
  <div class="mb">
    <h2 id="m-title">핀 추가</h2>
    <div class="mf" id="type-row">
      <label>유형</label>
      <div class="type-toggle">
        <button class="tt-btn on" id="tt-prop" onclick="setType('prop')">매물</button>
        <button class="tt-btn"    id="tt-ref"  onclick="setType('ref')">참고 지점</button>
      </div>
    </div>
    <div id="prop-f">
      <div class="mf"><label>색상</label><div class="swatches" id="sw-wrap"></div></div>
      <div class="mf"><label>매물명</label><input id="f-name" placeholder="예: 연무장길 1층 A호"/></div>
      <div class="mf"><label>보증금</label><input id="f-dep"  placeholder="예: 3억"/></div>
      <div class="mf"><label>월 임대료</label><input id="f-rent" placeholder="예: 600만원"/></div>
      <div class="mf"><label>전용면적</label><input id="f-area" placeholder="예: 35평 / 115㎡"/></div>
      <div class="mf"><label>메모</label><textarea id="f-memo" placeholder="층, 접근성, 특이사항 등..."></textarea></div>
    </div>
    <div id="ref-f" style="display:none">
      <div class="mf"><label>장소명</label><input id="f-rname" placeholder="예: 성수초등학교"/></div>
      <div class="mf"><label>메모(선택)</label><input id="f-rnote" placeholder="간단한 메모"/></div>
    </div>
    <div id="mst"></div>
    <div class="mbtns">
      <button class="btn-c" onclick="closePin()">취소</button>
      <button class="btn-s" onclick="savePin()">저장</button>
    </div>
  </div>
</div>

<!-- ZONE NAME MODAL -->
<div id="m-zone" class="mo">
  <div class="mb" style="width:270px">
    <h2>영역 이름</h2>
    <input id="z-name" style="width:100%;background:#f7f5f2;border:1px solid #eeebe6;border-radius:7px;padding:7px 10px;font-size:13px;color:#111;outline:none;font-family:inherit" placeholder="예: 무신사 인근, 서울숲 블록"/>
    <div class="mbtns" style="margin-top:12px">
      <button class="btn-c" onclick="cancelDraw()">취소</button>
      <button class="btn-s" onclick="confirmZone()">저장</button>
    </div>
  </div>
</div>

<!-- IMPORT MODAL -->
<div id="m-imp" class="mo">
  <div class="mb">
    <h2>JSON 가져오기</h2>
    <p style="font-size:11px;color:#aaa;margin-bottom:10px;line-height:1.6">내보낸 JSON을 붙여넣으세요. 기존 데이터에 추가됩니다.</p>
    <textarea id="imp-ta" placeholder='{"props":[...],...}'></textarea>
    <div id="imp-st"></div>
    <div class="mbtns" style="margin-top:10px">
      <button class="btn-c" onclick="closeImport()">취소</button>
      <button class="btn-s" onclick="doImport()">불러오기</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const COLORS=[
  {id:'blue',  hex:'#4A8FD9',label:'파랑'},
  {id:'green', hex:'#52A869',label:'초록'},
  {id:'purple',hex:'#8B6FD4',label:'보라'},
  {id:'red',   hex:'#E24B4A',label:'빨강'},
  {id:'orange',hex:'#EF9F27',label:'주황'},
  {id:'pink',  hex:'#D4537E',label:'분홍'},
  {id:'gray',  hex:'#888888',label:'회색'},
];

// ── STORAGE
function save(){
  localStorage.setItem(SK,JSON.stringify({props,refs,places,nProp,nRef,nPlace}));
}
function load(){
  try{
    const stored=localStorage.getItem(SK);
    const src=stored?JSON.parse(stored):{...SEED,nProp:28,nRef:4,nPlace:80};
    nProp=src.nProp||28; nRef=src.nRef||4; nPlace=src.nPlace||80;
    (src.props||[]).forEach(p=>{props.push(p);addPM(p);addPC(p);});
    (src.refs||[]).forEach(r=>{refs.push(r);addRM(r);addRC(r);});
    (src.places||[]).forEach(pl=>{places.push(pl);restorePL(pl);});
    renderPL();
    if(!stored) save();
  }catch(e){console.warn(e);}
}

// ── SEARCH
async function doSearch(){
  const raw=document.getElementById('srch-inp').value.trim();
  if(!raw) return;
  const btn=document.getElementById('srch-btn');
  btn.disabled=true; btn.textContent='...';
  setSS('검색 중...');
  document.getElementById('srch-res').innerHTML='';
  const isPostal=/^\d{5}$/.test(raw);
  const urls=isPostal
    ?[`https://nominatim.openstreetmap.org/search?postalcode=${raw}&countrycodes=kr&format=json&limit=5&accept-language=ko`]
    :[`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(raw)}&countrycodes=kr&format=json&limit=5&accept-language=ko`,
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(raw+' 서울')}&countrycodes=kr&format=json&limit=5&accept-language=ko`];
  let data=[];
  for(const u of urls){try{const r=await fetch(u);data=await r.json();if(data.length)break;}catch(e){}}
  btn.disabled=false; btn.textContent='검색';
  if(!data.length){setSS('결과 없음. 도로명 주소나 우편번호(5자리)로 시도해 보세요.');return;}
  setSS('');
  const w=document.getElementById('srch-res');
  data.forEach(r=>{
    const div=document.createElement('div');div.className='sri';
    const nm=r.display_name.split(',')[0].trim();
    const ad=r.display_name.split(',').slice(1,4).filter(Boolean).join(', ').trim();
    div.innerHTML=`<div class="sri-name">${nm}</div><div class="sri-addr">${ad}</div>`;
    div.onclick=()=>{
      pendLL={lat:parseFloat(r.lat),lng:parseFloat(r.lon)};
      map.flyTo([pendLL.lat,pendLL.lng],17,{duration:.7});
      document.getElementById('srch-res').innerHTML='';
      document.getElementById('srch-inp').value=nm; setSS('');
      document.getElementById('f-name').value=nm;
      setTimeout(openPin,600);
    };
    w.appendChild(div);
  });
}
function setSS(m){document.getElementById('srch-st').textContent=m;}

// ── PIN MODAL
function setType(t){
  selType=t;
  document.getElementById('tt-prop').classList.toggle('on',t==='prop');
  document.getElementById('tt-ref').classList.toggle('on',t==='ref');
  document.getElementById('prop-f').style.display=t==='prop'?'block':'none';
  document.getElementById('ref-f').style.display=t==='ref'?'block':'none';
}
function openPin(){
  editId=null; setType('prop'); setColor('blue');
  document.getElementById('m-title').textContent='핀 추가';
  document.getElementById('type-row').style.display='block';
  document.getElementById('mst').textContent='';
  ['f-name','f-dep','f-rent','f-area','f-memo','f-rname','f-rnote'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  document.getElementById('m-pin').classList.add('on');
  setTimeout(()=>document.getElementById('f-name').focus(),80);
}
function openEdit(id){
  const p=props.find(x=>x.id===id);if(!p)return;
  editId=id; map.closePopup();
  setType('prop'); setColor(p.color||'blue');
  document.getElementById('m-title').textContent='매물 수정';
  document.getElementById('type-row').style.display='none';
  document.getElementById('mst').textContent='';
  document.getElementById('f-name').value=p.name||'';
  document.getElementById('f-dep').value=p.dep||'';
  document.getElementById('f-rent').value=p.rent||'';
  document.getElementById('f-area').value=p.area||'';
  document.getElementById('f-memo').value=p.memo||'';
  document.getElementById('m-pin').classList.add('on');
  setTimeout(()=>document.getElementById('f-name').focus(),80);
}
function closePin(){
  document.getElementById('m-pin').classList.remove('on');
  document.getElementById('type-row').style.display='block';
  pendLL=null; editId=null;
}
function savePin(){
  if(editId){updateProp();return;}
  if(!pendLL){closePin();return;}
  selType==='prop'?doSaveProp():doSaveRef();
}
function doSaveProp(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){document.getElementById('mst').textContent='매물명을 입력해주세요.';return;}
  const p={id:nProp++,name,lat:pendLL.lat,lng:pendLL.lng,color:selColor,
    dep:document.getElementById('f-dep').value.trim(),
    rent:document.getElementById('f-rent').value.trim(),
    area:document.getElementById('f-area').value.trim(),
    memo:document.getElementById('f-memo').value.trim()};
  props.push(p);addPM(p);addPC(p);closePin();save();
  setTimeout(()=>PM[p.id]?.openPopup(),150);
}
function doSaveRef(){
  const name=document.getElementById('f-rname').value.trim();
  if(!name){document.getElementById('mst').textContent='장소명을 입력해주세요.';return;}
  const r={id:nRef++,name,lat:pendLL.lat,lng:pendLL.lng,note:document.getElementById('f-rnote').value.trim()};
  refs.push(r);addRM(r);addRC(r);closePin();save();
}
function updateProp(){
  const p=props.find(x=>x.id===editId);if(!p){closePin();return;}
  p.name=document.getElementById('f-name').value.trim()||p.name;
  p.color=selColor;
  p.dep=document.getElementById('f-dep').value.trim();
  p.rent=document.getElementById('f-rent').value.trim();
  p.area=document.getElementById('f-area').value.trim();
  p.memo=document.getElementById('f-memo').value.trim();
  PM[p.id]?.setIcon(mkPIcon(p.color));
  PM[p.id]?.setPopupContent(puProp(p));
  const card=document.getElementById('pc-'+p.id);
  if(card){
    const c=cHex(p.color);
    card.querySelector('.pc-dot').style.background=c;
    card.querySelector('.pc-name').textContent=p.name;
    card.querySelector('.pc-sz').textContent=p.area||'';
    const pe=card.querySelector('.pc-pr');
    if(pe)pe.innerHTML=(p.dep||p.rent)?`${p.dep?'보증금 <span>'+p.dep+'</span>':''}${p.dep&&p.rent?' · ':''}${p.rent?'임대료 <span>'+p.rent+'</span>':''}`:''
  }
  save();closePin();
}

// ── PROP MARKERS
function cHex(id){return(COLORS.find(c=>c.id===id)||COLORS[0]).hex;}
function mkPIcon(cid){
  const c=cHex(cid);
  return L.divIcon({html:`<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34" viewBox="0 0 26 34"><path d="M13 0C5.82 0 0 5.82 0 13c0 8.58 13 21 13 21S26 21.58 26 13C26 5.82 20.18 0 13 0z" fill="${c}" stroke="white" stroke-width="1.5"/><circle cx="13" cy="13" r="4.5" fill="rgba(255,255,255,.9)"/></svg>`,className:'',iconSize:[26,34],iconAnchor:[13,34],popupAnchor:[0,-36]});
}
function puProp(p){
  const c=cHex(p.color);
  return `<div class="pu"><div class="pu-bar" style="background:${c}"></div><div class="pu-name">${p.name}</div>${p.dep?`<div class="pu-row"><span class="pu-lbl">보증금</span><span class="pu-val">${p.dep}</span></div>`:''}${p.rent?`<div class="pu-row"><span class="pu-lbl">월 임대료</span><span class="pu-val">${p.rent}</span></div>`:''}${p.area?`<div class="pu-row"><span class="pu-lbl">전용면적</span><span class="pu-val">${p.area}</span></div>`:''}${p.memo?`<div class="pu-memo">${p.memo}</div>`:''}` +
    `<div class="pu-acts"><button class="pu-btn edit" onclick="openEdit(${p.id})">수정</button><button class="pu-btn del" onclick="delProp(${p.id})">삭제</button></div></div>`;
}
function addPM(p){
  const m=L.marker([p.lat,p.lng],{icon:mkPIcon(p.color)}).addTo(map).bindPopup(puProp(p),{maxWidth:270});
  m.on('click',()=>hlC('pc-'+p.id));PM[p.id]=m;
}
function addPC(p){
  const c=cHex(p.color);
  const el=document.createElement('div');el.className='pc';el.id='pc-'+p.id;
  el.innerHTML=`<div class="pc-top"><div class="pc-dot" style="background:${c}"></div><div class="pc-name">${p.name}</div><div class="pc-sz">${p.area||''}</div><span class="pc-x" onclick="event.stopPropagation();delProp(${p.id})">×</span></div>${(p.dep||p.rent)?`<div class="pc-pr">${p.dep?'보증금 <span>'+p.dep+'</span>':''}${p.dep&&p.rent?' · ':''}${p.rent?'임대료 <span>'+p.rent+'</span>':''}</div>`:''}`;
  el.onclick=()=>{map.flyTo([p.lat,p.lng],17,{duration:.6});setTimeout(()=>PM[p.id]?.openPopup(),500);hlC('pc-'+p.id);};
  document.getElementById('prop-list').appendChild(el);
}
function delProp(id){
  if(!confirm('삭제할까요?'))return;
  map.removeLayer(PM[id]);delete PM[id];
  props=props.filter(p=>p.id!==id);
  document.getElementById('pc-'+id)?.remove();map.closePopup();save();
}

// ── REF MARKERS
const refIcon=L.divIcon({html:`<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="white" stroke="#999" stroke-width="2"/><circle cx="8" cy="8" r="2" fill="#bbb"/></svg>`,className:'',iconSize:[16,16],iconAnchor:[8,8],popupAnchor:[0,-10]});
function puRef(r){return`<div class="pu"><div class="pu-ref-name">📍 ${r.name}</div>${r.note?`<div class="pu-ref-note">${r.note}</div>`:''} <div class="pu-acts"><button class="pu-btn del" onclick="delRef(${r.id})">삭제</button></div></div>`;}
function addRM(r){
  const m=L.marker([r.lat,r.lng],{icon:refIcon}).addTo(map).bindPopup(puRef(r),{maxWidth:200});
  m.on('click',()=>hlC('rc-'+r.id));RM[r.id]=m;
}
function addRC(r){
  const el=document.createElement('div');el.className='rc';el.id='rc-'+r.id;
  el.innerHTML=`<div class="rc-top"><div class="rc-ring"></div><div class="rc-name">${r.name}</div><span class="rc-x" onclick="event.stopPropagation();delRef(${r.id})">×</span></div>`;
  el.onclick=()=>{map.flyTo([r.lat,r.lng],17,{duration:.6});setTimeout(()=>RM[r.id]?.openPopup(),500);hlC('rc-'+r.id);};
  document.getElementById('ref-list').appendChild(el);
}
function delRef(id){
  if(!confirm('삭제할까요?'))return;
  map.removeLayer(RM[id]);delete RM[id];
  refs=refs.filter(r=>r.id!==id);
  document.getElementById('rc-'+id)?.remove();map.closePopup();save();
}
function hlC(id){
  if(activeC)document.getElementById(activeC)?.classList.remove('on');
  document.getElementById(id)?.classList.add('on');activeC=id;
}

// ── DRAW
function setDT(t){
  dTier=t;
  document.querySelectorAll('.tr').forEach((el,i)=>{
    const ti=i+1,c=TC[ti];
    el.style.borderColor=ti===t?c:'#f0ede8';
    el.style.background=ti===t?c+'18':'#fff';
  });
}
setDT(1);
function startDraw(mode){
  if(dMode===mode){stopDraw();return;}
  stopDraw();dMode=mode;
  document.getElementById('btn-'+mode).classList.add('on');
  document.body.classList.add('drawing');
  document.getElementById('dhint').innerHTML=mode==='line'?'클릭으로 점 추가 · <b>더블클릭</b>으로 완성':'클릭으로 꼭짓점 추가 · <b>더블클릭</b>으로 완성';
  document.getElementById('dtt').style.display='block';
}
function stopDraw(){
  dMode=null;dPts=[];
  document.getElementById('btn-line')?.classList.remove('on');
  document.getElementById('btn-zone')?.classList.remove('on');
  document.body.classList.remove('drawing');
  dDots.forEach(d=>map.removeLayer(d));dDots=[];
  if(dPrev){map.removeLayer(dPrev);dPrev=null;}
  document.getElementById('dtt').style.display='none';
  document.getElementById('dhint').innerHTML='<b>선</b> — 클릭으로 점 추가, <b>더블클릭</b>으로 완성<br><b>영역</b> — 꼭짓점 추가, <b>더블클릭</b>으로 완성';
}
map.on('mousemove',e=>{
  if(!dMode)return;
  const tt=document.getElementById('dtt');
  tt.style.left=e.originalEvent.clientX+'px';tt.style.top=e.originalEvent.clientY+'px';
  tt.textContent=dMode==='line'?(dPts.length===0?'시작점 클릭':`${dPts.length}개 · 더블클릭 완성`):(dPts.length===0?'꼭짓점 클릭':`${dPts.length}개 · 더블클릭 완성`);
  if(dPts.length>=1){
    const pts=[...dPts,e.latlng];
    if(dPrev)map.removeLayer(dPrev);
    const c=TC[dTier];
    dPrev=dMode==='line'
      ?L.polyline(pts,{color:c,weight:4,opacity:.45,dashArray:'6,4'}).addTo(map)
      :(pts.length>=3?L.polygon(pts,{color:c,weight:2,opacity:.45,fillColor:c,fillOpacity:.07,dashArray:'5,4'}).addTo(map):null);
  }
});
function addDPt(ll){
  dPts.push(ll);
  dDots.push(L.circleMarker(ll,{radius:4,color:'#fff',fillColor:TC[dTier],fillOpacity:1,weight:2}).addTo(map));
}
function finishDraw(){
  if(dMode==='line'&&dPts.length<2){stopDraw();return;}
  if(dMode==='zone'&&dPts.length<3){stopDraw();return;}
  if(dMode==='line'){
    commitPlace('선 '+(places.filter(p=>p.mode==='line').length+1),'line');
  }else{
    document.getElementById('z-name').value='';
    document.getElementById('m-zone').classList.add('on');
    setTimeout(()=>document.getElementById('z-name').focus(),80);
  }
}
function confirmZone(){
  const name=document.getElementById('z-name').value.trim()||('영역 '+(places.filter(p=>p.mode==='zone').length+1));
  document.getElementById('m-zone').classList.remove('on');
  commitPlace(name,'zone');
}
function cancelDraw(){document.getElementById('m-zone').classList.remove('on');stopDraw();}
function commitPlace(name,mode){
  const c=TC[dTier],pts=[...dPts];
  let layer;
  if(mode==='line'){
    layer=L.polyline(pts,{color:c,weight:5,opacity:.75,lineCap:'round',lineJoin:'round'}).addTo(map);
    layer.bindPopup(`<div class="pu"><div class="pu-ref-name">〰 ${name}</div><div class="pu-acts"><button class="pu-btn del" onclick="delPlace(${nPlace})">삭제</button></div></div>`,{maxWidth:180});
  }else{
    layer=L.polygon(pts,{color:c,weight:2,opacity:.7,fillColor:c,fillOpacity:.12}).addTo(map);
    layer.bindTooltip(name,{permanent:true,direction:'center',className:'plbl'});
  }
  const id=nPlace++;
  PLM[id]=layer;
  places.push({id,name,tier:dTier,mode,pts});
  stopDraw();renderPL();save();
}
function restorePL(pl){
  const c=TC[pl.tier];
  let layer;
  const pts=pl.pts||pl.points||[];
  if(pl.mode==='line'){
    layer=L.polyline(pts,{color:c,weight:5,opacity:.75,lineCap:'round',lineJoin:'round'}).addTo(map);
    layer.bindPopup(`<div class="pu"><div class="pu-ref-name">〰 ${pl.name}</div><div class="pu-acts"><button class="pu-btn del" onclick="delPlace(${pl.id})">삭제</button></div></div>`,{maxWidth:180});
  }else{
    layer=L.polygon(pts,{color:c,weight:2,opacity:.7,fillColor:c,fillOpacity:.12}).addTo(map);
    layer.bindTooltip(pl.name,{permanent:true,direction:'center',className:'plbl'});
  }
  PLM[pl.id]=layer;
}
function renderPL(){
  const w=document.getElementById('places-list');w.innerHTML='';
  places.forEach(p=>{
    const c=TC[p.tier];
    const el=document.createElement('div');el.className='plc-item';
    const ind=p.mode==='line'?`<div class="plc-line" style="background:${c}"></div>`:`<div class="plc-area" style="background:${c};border:2px solid ${c}"></div>`;
    el.innerHTML=`${ind}<span class="plc-name">${p.name}</span><span class="plc-x" onclick="delPlace(${p.id})">×</span>`;
    w.appendChild(el);
  });
}
function delPlace(id){
  if(!confirm('삭제할까요?'))return;
  map.removeLayer(PLM[id]);delete PLM[id];
  places=places.filter(p=>p.id!==id);renderPL();save();
}

// ── JSON
function doExport(){
  const data={version:3,exportedAt:new Date().toISOString(),props,refs,places};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download='seongsu_map_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function openImport(){document.getElementById('imp-ta').value='';document.getElementById('imp-st').textContent='';document.getElementById('m-imp').classList.add('on');}
function closeImport(){document.getElementById('m-imp').classList.remove('on');}
function doImport(){
  let data;
  try{data=JSON.parse(document.getElementById('imp-ta').value.trim());}
  catch(e){document.getElementById('imp-st').textContent='JSON 형식이 올바르지 않아요.';return;}
  (data.props||[]).forEach(p=>{p.id=nProp++;props.push(p);addPM(p);addPC(p);});
  (data.refs||[]).forEach(r=>{r.id=nRef++;refs.push(r);addRM(r);addRC(r);});
  (data.places||[]).forEach(pl=>{pl.id=nPlace++;places.push(pl);restorePL(pl);});
  renderPL();save();closeImport();
  const first=(data.props||[])[0]||(data.refs||[])[0];
  if(first)map.flyTo([first.lat,first.lng],16,{duration:.8});
}

// ── KEYBOARD
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closePin();cancelDraw();stopDraw();closeImport();}
  if(e.key==='Enter'&&document.getElementById('m-zone').classList.contains('on'))confirmZone();
});

load();
</script>
</body>
</html>
