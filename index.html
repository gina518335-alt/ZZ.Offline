<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>성수동 매물 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  background: #f0ede8; color: #1a1a1a; height: 100vh; display: flex; overflow: hidden;
}

/* ── SIDEBAR ── */
#sidebar {
  width: 300px; min-width: 300px; height: 100vh;
  background: #fff; border-right: 1px solid #e8e5e0;
  display: flex; flex-direction: column; overflow: hidden;
}
#sidebar-header { padding: 16px 16px 12px; border-bottom: 1px solid #f0ede8; }
#sidebar-header h1 { font-size: 14px; font-weight: 600; color: #111; letter-spacing: -0.3px; }
#sidebar-header p { font-size: 11px; color: #bbb; margin-top: 2px; }

#mode-tabs { display: flex; border-bottom: 1px solid #f0ede8; }
.mode-tab {
  flex: 1; padding: 10px 4px; font-size: 12px; color: #bbb; text-align: center;
  cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s;
  font-family: inherit; background: none; border-top: none; border-left: none; border-right: none;
}
.mode-tab.active { color: #111; border-bottom-color: #111; font-weight: 500; }
.mode-tab:hover:not(.active) { color: #888; }

.tab-panel { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.tab-panel.active { display: flex; }

/* ── SEARCH ── */
#panel-pin { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#search-wrap { padding: 10px 12px 8px; border-bottom: 1px solid #f0ede8; }
#search-row { display: flex; gap: 6px; }
#search-input {
  flex: 1; background: #f7f5f2; border: 1px solid #e8e5e0; border-radius: 7px;
  padding: 7px 10px; color: #111; font-size: 12px; outline: none; font-family: inherit;
}
#search-input:focus { border-color: #ccc; background: #fff; }
#search-input::placeholder { color: #bbb; }
#search-btn {
  padding: 7px 11px; background: #111; border: none; border-radius: 7px;
  color: #fff; font-size: 12px; cursor: pointer; font-family: inherit;
}
#search-btn:hover { background: #333; }
#search-btn:disabled { background: #ccc; cursor: not-allowed; }
#search-status { font-size: 11px; color: #bbb; margin-top: 4px; min-height: 14px; padding: 0 2px; }
#search-results { margin-top: 4px; }
.search-result-item {
  padding: 7px 10px; background: #f7f5f2; border: 1px solid #eeebe6;
  border-radius: 6px; margin-bottom: 3px; font-size: 12px; cursor: pointer; line-height: 1.4;
}
.search-result-item:hover { background: #eeeae4; }
.res-name { font-weight: 500; color: #111; }
.res-addr { font-size: 10px; color: #aaa; margin-top: 1px; }

/* color legend */
.color-legend { padding: 9px 14px; border-bottom: 1px solid #f0ede8; }
.legend-title { font-size: 10px; color: #ccc; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.color-swatches-row { display: flex; gap: 5px; flex-wrap: wrap; }
.swatch-legend { width: 14px; height: 14px; border-radius: 50%; cursor: default; }
.swatch-legend-label { font-size: 10px; color: #bbb; display: flex; align-items: center; gap: 4px; }

/* prop list */
#prop-list-wrap { flex: 1; overflow-y: auto; padding: 6px 10px 10px; }
#prop-list-wrap::-webkit-scrollbar { width: 3px; }
#prop-list-wrap::-webkit-scrollbar-thumb { background: #e0dbd4; border-radius: 4px; }
.list-label { font-size: 10px; color: #ccc; text-transform: uppercase; letter-spacing: 1px; padding: 8px 8px 3px; }
.prop-card {
  border: 1px solid #f0ede8; border-radius: 8px; padding: 9px 11px; margin-bottom: 4px;
  cursor: pointer; transition: border-color 0.12s, background 0.12s; background: #fff;
}
.prop-card:hover { background: #faf8f5; border-color: #dedad4; }
.prop-card.active { border-color: #c8c4be; background: #faf8f5; }
.pc-top { display: flex; align-items: center; gap: 7px; }
.pc-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.pc-name { font-size: 12px; font-weight: 500; color: #111; flex: 1; }
.pc-area { font-size: 11px; color: #ccc; }
.pc-del { font-size: 14px; color: #bbb; cursor: pointer; padding-left: 6px; font-weight: 400; }
.pc-del:hover { color: #e24b4a; }
.pc-price { margin-top: 4px; font-size: 11px; color: #bbb; padding-left: 16px; }
.pc-price span { color: #888; font-weight: 500; }
/* ref card */
.ref-card {
  border: 1px dashed #e8e5e0; border-radius: 8px; padding: 8px 11px; margin-bottom: 4px;
  cursor: pointer; transition: all 0.12s; background: #fafafa;
}
.ref-card:hover { background: #f5f3f0; border-color: #ccc; }
.ref-card.active { border-color: #bbb; }
.rc-top { display: flex; align-items: center; gap: 7px; }
.rc-ring { width: 9px; height: 9px; border-radius: 50%; border: 2px solid #aaa; flex-shrink: 0; background: transparent; }
.rc-name { font-size: 12px; color: #888; flex: 1; }
.rc-del { font-size: 14px; color: #bbb; cursor: pointer; padding-left: 6px; }
.rc-del:hover { color: #e24b4a; }

#pin-hint { padding: 8px 12px; border-top: 1px solid #f0ede8; font-size: 11px; color: #ccc; line-height: 1.7; }
#pin-hint b { color: #aaa; font-weight: 500; }

/* ── DRAW PANEL ── */
#panel-draw { padding: 12px; gap: 8px; overflow-y: auto; }
.draw-section-label { font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 7px; margin-top: 2px; }
.tier-radio-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.tier-radio {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border: 1.5px solid #f0ede8; border-radius: 7px; cursor: pointer;
  transition: all 0.12s; background: #fff;
}
.tier-radio:hover { border-color: #dedad4; }
.tier-radio-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.tier-radio-label { font-size: 12px; color: #444; flex: 1; }
.draw-btns { display: flex; gap: 6px; margin-bottom: 10px; }
.draw-btn {
  flex: 1; padding: 10px 6px; border: 1.5px solid #e8e5e0; border-radius: 8px;
  background: #fff; font-size: 11px; color: #888; cursor: pointer; font-family: inherit;
  text-align: center; transition: all 0.12s; line-height: 1.5;
}
.draw-btn:hover { border-color: #ccc; background: #faf8f5; color: #333; }
.draw-btn.active { background: #111; color: #fff; border-color: #111; }
.draw-btn .btn-icon { font-size: 17px; display: block; margin-bottom: 2px; }
#draw-hint-box {
  background: #f7f5f2; border: 1px solid #e8e5e0; border-radius: 8px;
  padding: 9px 11px; font-size: 11px; color: #999; line-height: 1.7;
}
#draw-hint-box b { color: #666; font-weight: 500; }
#places-list-wrap { margin-top: 10px; }
.place-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border: 1px solid #f0ede8; border-radius: 7px; margin-bottom: 4px;
  background: #fff; font-size: 12px;
}
.place-line { width: 20px; height: 3px; border-radius: 2px; flex-shrink: 0; }
.place-area { width: 15px; height: 13px; border-radius: 3px; flex-shrink: 0; opacity: 0.55; }
.place-name { flex: 1; color: #333; }
.place-del { font-size: 13px; color: #bbb; cursor: pointer; padding-left: 4px; }
.place-del:hover { color: #e24b4a; }

/* ── MAP ── */
#map { flex: 1; height: 100vh; }
.leaflet-container { cursor: default; }
.map-drawing { cursor: crosshair !important; }
.map-drawing .leaflet-container { cursor: crosshair !important; }

/* ── permanent tooltip ── */
.leaflet-tooltip.place-label {
  background: rgba(255,255,255,0.92); border: 1px solid #ddd;
  border-radius: 5px; padding: 3px 8px; font-size: 11px; font-weight: 600;
  color: #333; box-shadow: 0 1px 6px rgba(0,0,0,0.1); white-space: nowrap;
  pointer-events: none;
}
.leaflet-tooltip.place-label::before { display: none; }

/* ── draw tooltip ── */
#draw-tooltip {
  display: none; position: fixed; pointer-events: none; z-index: 8000;
  background: #111; color: #fff; font-size: 11px; padding: 5px 10px;
  border-radius: 6px; transform: translate(12px, -50%);
}

/* ── POPUP ── */
.leaflet-popup-content-wrapper {
  background: #fff !important; border: 1px solid #e8e5e0 !important;
  border-radius: 10px !important; box-shadow: 0 4px 24px rgba(0,0,0,0.1) !important; padding: 0 !important;
}
.leaflet-popup-tip { background: #fff !important; }
.leaflet-popup-content { margin: 0 !important; }
.popup-inner { padding: 13px 15px; min-width: 190px; max-width: 250px; }
.popup-colorbar { width: 100%; height: 3px; border-radius: 2px; margin-bottom: 10px; }
.popup-name { font-size: 14px; font-weight: 600; color: #111; margin-bottom: 9px; line-height: 1.35; }
.popup-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #f5f3f0; }
.popup-row:last-of-type { border: none; }
.popup-label { font-size: 11px; color: #bbb; }
.popup-val { font-size: 11px; color: #444; font-weight: 500; }
.popup-memo { margin-top: 8px; padding-top: 8px; border-top: 1px solid #f5f3f0; font-size: 11px; color: #999; line-height: 1.6; }
.popup-del { width: 100%; margin-top: 8px; padding: 5px; background: #f5f3f0; border: none; border-radius: 5px; font-size: 11px; color: #888; cursor: pointer; font-family: inherit; }
.popup-del:hover { background: #fdecea; color: #e24b4a; }
/* ref popup */
.ref-popup-inner { padding: 11px 14px; }
.ref-popup-name { font-size: 13px; font-weight: 500; color: #666; margin-bottom: 8px; }
.ref-popup-note { font-size: 11px; color: #aaa; margin-bottom: 8px; line-height: 1.5; }

/* ── JSON BAR ── */
#json-bar {
  display: flex; gap: 6px; padding: 10px 12px;
  border-top: 1px solid #f0ede8; background: #fff; flex-shrink: 0;
}
.json-btn {
  flex: 1; padding: 8px 6px; background: #f7f5f2; border: 1px solid #e8e5e0;
  border-radius: 7px; font-size: 11px; color: #666; cursor: pointer;
  font-family: inherit; transition: all 0.12s; font-weight: 500;
}
.json-btn:hover { background: #eeeae4; border-color: #dedad4; color: #333; }

/* ── MODALS (shared base) ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.2); z-index: 9999;
  align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: #fff; border: 1px solid #e8e5e0; border-radius: 14px;
  padding: 20px; width: 330px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 8px 40px rgba(0,0,0,0.12);
}
.modal-box h2 { font-size: 14px; font-weight: 600; color: #111; margin-bottom: 14px; }
.mf { margin-bottom: 9px; }
.mf label { display: block; font-size: 11px; color: #aaa; margin-bottom: 4px; }
.mf input, .mf textarea {
  width: 100%; background: #f7f5f2; border: 1px solid #eeebe6; border-radius: 7px;
  padding: 7px 10px; color: #111; font-size: 13px; outline: none; font-family: inherit; transition: border-color 0.15s;
}
.mf input:focus, .mf textarea:focus { border-color: #ccc; background: #fff; }
.mf textarea { resize: vertical; min-height: 55px; }
.modal-btns { display: flex; gap: 7px; margin-top: 14px; }
.modal-btns button {
  flex: 1; padding: 9px; border-radius: 8px; font-size: 13px;
  cursor: pointer; border: none; font-family: inherit; font-weight: 500;
}
.btn-cancel { background: #f5f3f0; color: #999; }
.btn-cancel:hover { background: #eeebe6; }
.btn-save { background: #111; color: #fff; }
.btn-save:hover { background: #333; }
#modal-status { font-size: 11px; color: #e24b4a; min-height: 14px; margin-top: 5px; text-align: center; }

/* ── MARKER TYPE TOGGLE ── */
.type-toggle { display: flex; gap: 5px; margin-bottom: 12px; }
.type-btn {
  flex: 1; padding: 7px 4px; border: 1.5px solid #eee; border-radius: 7px;
  font-size: 11px; cursor: pointer; text-align: center;
  background: #fff; color: #bbb; font-family: inherit; transition: all 0.12s;
}
.type-btn.selected { background: #111; color: #fff; border-color: #111; }

/* ── COLOR SWATCHES ── */
.color-swatches { display: flex; gap: 7px; flex-wrap: wrap; }
.cswatch {
  width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
  border: 2.5px solid transparent; transition: all 0.12s;
  position: relative;
}
.cswatch:hover { transform: scale(1.1); }
.cswatch.selected { border-color: #fff; box-shadow: 0 0 0 2px #333; }

/* ── IMPORT ── */
#import-textarea {
  width: 100%; height: 110px; background: #f7f5f2; border: 1px solid #e8e5e0;
  border-radius: 8px; padding: 8px 10px; font-size: 11px; color: #333;
  font-family: 'Menlo', 'Consolas', monospace; resize: vertical; outline: none;
}
#import-textarea:focus { border-color: #ccc; background: #fff; }
#import-status { font-size: 11px; min-height: 14px; margin-top: 5px; color: #e24b4a; }
#import-desc { font-size: 11px; color: #aaa; line-height: 1.6; margin-bottom: 10px; }

/* ── PLACE MODAL ── */
#place-modal-overlay .modal-box { width: 270px; }
#place-modal-overlay .modal-box h2 { margin-bottom: 10px; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>성수동 매물 지도</h1>
    <p>연무장길 · 서울숲 권역</p>
  </div>

  <div id="mode-tabs">
    <button class="mode-tab active" onclick="switchTab('pin')">📍 핀</button>
    <button class="mode-tab" onclick="switchTab('draw')">✏️ 장소</button>
  </div>

  <!-- ── PIN TAB ── -->
  <div class="tab-panel active" id="panel-pin">
    <div id="search-wrap">
      <div id="search-row">
        <input id="search-input" placeholder="주소 또는 우편번호(5자리)" onkeydown="if(event.key==='Enter')searchAddr()"/>
        <button id="search-btn" onclick="searchAddr()">검색</button>
      </div>
      <div id="search-status"></div>
      <div id="search-results"></div>
    </div>

    <div id="prop-list-wrap">
      <div class="list-label">매물</div>
      <div id="prop-list"></div>
      <div class="list-label" style="margin-top:6px;">참고 지점</div>
      <div id="ref-list"></div>
    </div>
    <div id="pin-hint"><b>지도 클릭</b> 또는 <b>주소 검색</b>으로 핀을 찍어요</div>
  </div>

  <!-- ── DRAW TAB ── -->
  <div class="tab-panel" id="panel-draw">
    <div class="draw-section-label">티어 선택</div>
    <div class="tier-radio-group">
      <div class="tier-radio" onclick="selectDrawTier(1)">
        <div class="tier-radio-dot" style="background:#E24B4A;"></div>
        <span class="tier-radio-label">1티어 — 연무장길 메인</span>
      </div>
      <div class="tier-radio" onclick="selectDrawTier(2)">
        <div class="tier-radio-dot" style="background:#EF9F27;"></div>
        <span class="tier-radio-label">2티어 — 랜드마크 인근</span>
      </div>
      <div class="tier-radio" onclick="selectDrawTier(3)">
        <div class="tier-radio-dot" style="background:#aaa;"></div>
        <span class="tier-radio-label">3티어 — 기타</span>
      </div>
    </div>

    <div class="draw-section-label">그리기</div>
    <div class="draw-btns">
      <button class="draw-btn" id="btn-line" onclick="startDraw('line')">
        <span class="btn-icon">〰️</span>선 긋기<br><span style="font-size:10px;opacity:0.7;">가로수길·연무장길</span>
      </button>
      <button class="draw-btn" id="btn-zone" onclick="startDraw('zone')">
        <span class="btn-icon">⬡</span>영역 그리기<br><span style="font-size:10px;opacity:0.7;">블록·구역</span>
      </button>
    </div>
    <div id="draw-hint-box">
      <b>선 긋기</b> — 클릭으로 점 추가, <b>더블클릭</b>으로 완성<br>
      <b>영역 그리기</b> — 꼭짓점 추가, <b>더블클릭</b>으로 완성
    </div>
    <div id="places-list-wrap">
      <div class="list-label" style="margin-top:10px;">그린 장소</div>
      <div id="places-list"></div>
    </div>
  </div>

  <div id="json-bar">
    <button class="json-btn" onclick="exportJSON()">⬇ 내보내기</button>
    <button class="json-btn" onclick="openImport()">⬆ 가져오기</button>
  </div>
</div>

<div id="map"></div>
<div id="draw-tooltip"></div>

<!-- ── PIN MODAL ── -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal-box">
    <h2 id="modal-title">핀 추가</h2>

    <div class="mf">
      <label>유형</label>
      <div class="type-toggle">
        <button class="type-btn selected" id="type-prop" onclick="selectType('prop')">매물</button>
        <button class="type-btn" id="type-ref"  onclick="selectType('ref')">참고 지점</button>
      </div>
    </div>

    <!-- 매물 필드 -->
    <div id="prop-fields">
      <div class="mf">
        <label>색상</label>
        <div class="color-swatches" id="color-swatches"></div>
      </div>
      <div class="mf"><label>매물명</label><input id="f-name" placeholder="예: 연무장길 1층 A호"/></div>
      <div class="mf"><label>보증금</label><input id="f-deposit" placeholder="예: 3억"/></div>
      <div class="mf"><label>월 임대료</label><input id="f-rent" placeholder="예: 600만원"/></div>
      <div class="mf"><label>전용면적</label><input id="f-area" placeholder="예: 35평 / 115㎡"/></div>
      <div class="mf"><label>메모</label><textarea id="f-memo" placeholder="층, 접근성, 특이사항 등..."></textarea></div>
    </div>

    <!-- 참고 지점 필드 -->
    <div id="ref-fields" style="display:none;">
      <div class="mf"><label>장소명</label><input id="f-ref-name" placeholder="예: 성수초등학교, 어린이공원"/></div>
      <div class="mf"><label>메모 (선택)</label><input id="f-ref-note" placeholder="간단한 메모"/></div>
    </div>

    <div id="modal-status"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save"   onclick="savePin()">핀 찍기</button>
    </div>
  </div>
</div>

<!-- ── PLACE NAME MODAL ── -->
<div id="place-modal-overlay" class="modal-overlay">
  <div class="modal-box">
    <h2 id="pm-title">장소 이름</h2>
    <input id="pm-name" style="width:100%;background:#f7f5f2;border:1px solid #eeebe6;border-radius:7px;padding:7px 10px;font-size:13px;color:#111;outline:none;font-family:inherit;" placeholder="예: 연무장길, 무신사 인근"/>
    <div class="modal-btns" style="margin-top:12px;">
      <button class="btn-cancel" onclick="cancelDraw()">취소</button>
      <button class="btn-save"   onclick="confirmPlace()">저장</button>
    </div>
  </div>
</div>

<!-- ── IMPORT MODAL ── -->
<div id="import-overlay" class="modal-overlay">
  <div class="modal-box">
    <h2>JSON 가져오기</h2>
    <p id="import-desc">내보낸 JSON을 붙여넣으세요. 기존 데이터에 추가됩니다.</p>
    <textarea id="import-textarea" placeholder='{"properties":[...],...}'></textarea>
    <div id="import-status"></div>
    <div class="modal-btns" style="margin-top:10px;">
      <button class="btn-cancel" onclick="closeImport()">취소</button>
      <button class="btn-save"   onclick="importJSON()">불러오기</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ══════════════════════════════
// CONSTANTS
// ══════════════════════════════
const PIN_COLORS = [
  { id:'blue',   hex:'#4A8FD9', label:'파랑' },
  { id:'green',  hex:'#52A869', label:'초록' },
  { id:'purple', hex:'#8B6FD4', label:'보라' },
  { id:'red',    hex:'#E24B4A', label:'빨강' },
  { id:'orange', hex:'#EF9F27', label:'주황' },
  { id:'pink',   hex:'#D4537E', label:'분홍' },
  { id:'gray',   hex:'#888888', label:'회색' },
];
const TIER_COLORS = { 1:'#E24B4A', 2:'#EF9F27', 3:'#aaaaaa' };
const STORAGE_KEY = 'seongsu_map_v2';

// ══════════════════════════════

  document.querySelectorAll('.mode-tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='pin')||(i===1&&tab==='draw')));

function initSwatches() {
  const wrap = document.getElementById('color-swatches');
  PIN_COLORS.forEach(c=>{
    const s = document.createElement('div');
    s.className = 'cswatch' + (c.id===selectedColor?' selected':'');
    s.style.background = c.hex;
    s.title = c.label;
    s.dataset.id = c.id;
    s.onclick = ()=>{ selectColor(c.id); };
    wrap.appendChild(s);
  });
}
function selectColor(id) {
  selectedColor = id;
  document.querySelectorAll('.cswatch').forEach(s=>s.classList.toggle('selected', s.dataset.id===id));
}
initSwatches();

// ══════════════════════════════
// SEARCH
// ══════════════════════════════
async function searchAddr() {
  const raw = document.getElementById('search-input').value.trim();
  if(!raw) return;
  const btn = document.getElementById('search-btn');
  btn.disabled=true; btn.textContent='...';
  setSS('검색 중...');
  document.getElementById('search-results').innerHTML='';

  // 5자리 숫자 → 우편번호로 처리
  const isPostal = /^\d{5}$/.test(raw);

  const queries = isPostal
    ? [`https://nominatim.openstreetmap.org/search?postalcode=${raw}&countrycodes=kr&format=json&limit=5&accept-language=ko`]
    : [
        // 1차: 입력 그대로 + 한국 한정
        `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(raw)}&countrycodes=kr&format=json&limit=5&accept-language=ko`,
        // 2차: "서울" 붙여서 재시도 (이미 서울 포함이면 중복이지만 Nominatim은 괜찮음)
        `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(raw+' 서울')}&countrycodes=kr&format=json&limit=5&accept-language=ko`,
      ];

  let data = [];
  for (const url of queries) {
    try {
      const res = await fetch(url);
      data = await res.json();
      if (data.length) break;
    } catch(e) { /* 다음 시도로 */ }
  }

  if(!data.length){
    setSS('결과가 없어요. 도로명 주소나 우편번호(5자리)로 시도해 보세요.');
    btn.disabled=false; btn.textContent='검색'; return;
  }
  setSS(isPostal ? `우편번호 ${raw} 결과` : '');
  const wrap=document.getElementById('search-results');
  data.forEach(r=>{
    const div=document.createElement('div'); div.className='search-result-item';
    const parts = r.display_name.split(',');
    const name = parts[0].trim();
    const addr = parts.slice(1,4).filter(Boolean).join(', ').trim();
    div.innerHTML=`<div class="res-name">${name}</div><div class="res-addr">${addr}</div>`;
    div.onclick=()=>{
      pendingLatLng={lat:parseFloat(r.lat),lng:parseFloat(r.lon)};
      map.flyTo([pendingLatLng.lat,pendingLatLng.lng],17,{duration:0.7});
      document.getElementById('search-results').innerHTML='';
      document.getElementById('search-input').value=name;
      setSS('');
      document.getElementById('f-name').value=name;
      setTimeout(openModal,600);
    };
    wrap.appendChild(div);
  });
  btn.disabled=false; btn.textContent='검색';
}
function setSS(m){ document.getElementById('search-status').textContent=m; }

// ══════════════════════════════
// MODAL
// ══════════════════════════════
function selectType(t) {
  selectedType=t;
  document.getElementById('type-prop').classList.toggle('selected',t==='prop');
  document.getElementById('type-ref').classList.toggle('selected',t==='ref');
  document.getElementById('prop-fields').style.display = t==='prop'?'block':'none';
  document.getElementById('ref-fields').style.display  = t==='ref'?'block':'none';
}
function openModal() {
  selectType('prop'); selectColor('blue');
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-status').textContent='';
  setTimeout(()=>document.getElementById('f-name').focus(),80);
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  ['f-name','f-deposit','f-rent','f-area','f-memo','f-ref-name','f-ref-note'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  pendingLatLng=null;
}
function savePin() {
  if(!pendingLatLng){ closeModal(); return; }
  if(selectedType==='prop') saveProp();
  else saveRef();
}
function saveProp() {
  const name=document.getElementById('f-name').value.trim();
  if(!name){ document.getElementById('modal-status').textContent='매물명을 입력해주세요.'; return; }
  const p={id:nextPropId++, name, lat:pendingLatLng.lat, lng:pendingLatLng.lng,
    color:selectedColor,
    deposit:document.getElementById('f-deposit').value.trim(),
    rent:document.getElementById('f-rent').value.trim(),
    area:document.getElementById('f-area').value.trim(),
    memo:document.getElementById('f-memo').value.trim()};
  properties.push(p); _addPropMarker(p); _addPropCard(p);
  closeModal(); save();
  setTimeout(()=>markerMap[p.id]?.openPopup(),150);
}
function saveRef() {
  const name=document.getElementById('f-ref-name').value.trim();
  if(!name){ document.getElementById('modal-status').textContent='장소명을 입력해주세요.'; return; }
  const r={id:nextRefId++, name, lat:pendingLatLng.lat, lng:pendingLatLng.lng,
    note:document.getElementById('f-ref-note').value.trim()};
  refs.push(r); _addRefMarker(r); _addRefCard(r);
  closeModal(); save();
}

// ══════════════════════════════
// PROPERTY MARKERS
// ══════════════════════════════
function getColorHex(id){ return (PIN_COLORS.find(c=>c.id===id)||PIN_COLORS[0]).hex; }
function makePropIcon(colorId) {
  const c=getColorHex(colorId);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34" viewBox="0 0 26 34">
    <path d="M13 0C5.82 0 0 5.82 0 13c0 8.58 13 21 13 21S26 21.58 26 13C26 5.82 20.18 0 13 0z" fill="${c}" stroke="white" stroke-width="1.5"/>
    <circle cx="13" cy="13" r="4.5" fill="rgba(255,255,255,0.9)"/>
  </svg>`;
  return L.divIcon({html:svg, className:'', iconSize:[26,34], iconAnchor:[13,34], popupAnchor:[0,-36]});
}
function propPopupHTML(p) {
  const c=getColorHex(p.color);
  return `<div class="popup-inner">
    <div class="popup-colorbar" style="background:${c};"></div>
    <div class="popup-name">${p.name}</div>
    ${p.deposit?`<div class="popup-row"><span class="popup-label">보증금</span><span class="popup-val">${p.deposit}</span></div>`:''}
    ${p.rent?`<div class="popup-row"><span class="popup-label">월 임대료</span><span class="popup-val">${p.rent}</span></div>`:''}
    ${p.area?`<div class="popup-row"><span class="popup-label">전용면적</span><span class="popup-val">${p.area}</span></div>`:''}
    ${p.memo?`<div class="popup-memo">${p.memo.replace(/\n/g,'<br/>')}</div>`:''}
    <button class="popup-del" onclick="deleteProp(${p.id})">삭제</button>
  </div>`;
}
function _addPropMarker(p) {
  const m=L.marker([p.lat,p.lng],{icon:makePropIcon(p.color)}).addTo(map).bindPopup(propPopupHTML(p),{maxWidth:270});
  m.on('click',()=>hlCard(`card-${p.id}`)); markerMap[p.id]=m;
}
function _addPropCard(p) {
  const c=getColorHex(p.color);
  const card=document.createElement('div'); card.className='prop-card'; card.id=`card-${p.id}`;
  card.innerHTML=`<div class="pc-top"><div class="pc-dot" style="background:${c};"></div><div class="pc-name">${p.name}</div><div class="pc-area">${p.area||''}</div><span class="pc-del" onclick="event.stopPropagation();deleteProp(${p.id})">×</span></div>${(p.deposit||p.rent)?`<div class="pc-price">${p.deposit?'보증금 <span>'+p.deposit+'</span>':''} ${p.deposit&&p.rent?' · ':''} ${p.rent?'임대료 <span>'+p.rent+'</span>':''}</div>`:''}`;
  card.onclick=()=>{map.flyTo([p.lat,p.lng],17,{duration:0.6});setTimeout(()=>markerMap[p.id]?.openPopup(),500);hlCard(`card-${p.id}`);};
  document.getElementById('prop-list').appendChild(card);
}
function deleteProp(id) {
  if(!confirm('삭제할까요?')) return;
  map.removeLayer(markerMap[id]); delete markerMap[id];
  properties=properties.filter(p=>p.id!==id);
  document.getElementById(`card-${id}`)?.remove(); map.closePopup(); save();
}

// ══════════════════════════════
function makeRefIcon() {
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="6" fill="white" stroke="#999" stroke-width="2"/>
    <circle cx="8" cy="8" r="2" fill="#bbb"/>
  </svg>`;
  return L.divIcon({html:svg, className:'', iconSize:[16,16], iconAnchor:[8,8], popupAnchor:[0,-10]});
}
function refPopupHTML(r) {
  return `<div class="ref-popup-inner">
    <div class="ref-popup-name">📍 ${r.name}</div>
    ${r.note?`<div class="ref-popup-note">${r.note}</div>`:''}
    <button class="popup-del" onclick="deleteRef(${r.id})">삭제</button>
  </div>`;
}
function _addRefMarker(r) {
  const m=L.marker([r.lat,r.lng],{icon:makeRefIcon()}).addTo(map).bindPopup(refPopupHTML(r),{maxWidth:200});
  m.on('click',()=>hlCard(`rcard-${r.id}`)); refMarkerMap[r.id]=m;
}
function _addRefCard(r) {
  const card=document.createElement('div'); card.className='ref-card'; card.id=`rcard-${r.id}`;
  card.innerHTML=`<div class="rc-top"><div class="rc-ring"></div><div class="rc-name">${r.name}</div><span class="rc-del" onclick="event.stopPropagation();deleteRef(${r.id})">×</span></div>`;
  card.onclick=()=>{map.flyTo([r.lat,r.lng],17,{duration:0.6});setTimeout(()=>refMarkerMap[r.id]?.openPopup(),500);hlCard(`rcard-${r.id}`);};
  document.getElementById('ref-list').appendChild(card);
}
function deleteRef(id) {
  if(!confirm('삭제할까요?')) return;
  map.removeLayer(refMarkerMap[id]); delete refMarkerMap[id];
  refs=refs.filter(r=>r.id!==id);
  document.getElementById(`rcard-${id}`)?.remove(); map.closePopup(); save();
}

function hlCard(id) {
  if(activeCard) document.getElementById(activeCard)?.classList.remove('active');
  document.getElementById(id)?.classList.add('active'); activeCard=id;
}

// ══════════════════════════════
// DRAW MODE
// ══════════════════════════════
function selectDrawTier(t) {
  drawTier=t;
  document.querySelectorAll('.tier-radio').forEach((el,i)=>{
    const ti=i+1; const c=TIER_COLORS[ti];
    if(ti===t){ el.style.borderColor=c; el.style.background=c+'18'; }
    else{ el.style.borderColor='#f0ede8'; el.style.background='#fff'; }
  });
}
selectDrawTier(1);

function startDraw(mode) {
  if(drawMode===mode){ stopDraw(); return; }
  stopDraw(); drawMode=mode;
  document.getElementById(`btn-${mode==='line'?'line':'zone'}`).classList.add('active');
  document.getElementById('map').classList.add('map-drawing');
  document.getElementById('draw-hint-box').innerHTML = mode==='line'
    ? '클릭으로 점 추가 · <b>더블클릭</b>으로 완성'
    : '클릭으로 꼭짓점 추가 · <b>더블클릭</b>으로 완성';
  document.getElementById('draw-tooltip').style.display='block';
}
function stopDraw() {
  drawMode=null; drawPoints=[];
  document.getElementById('btn-line')?.classList.remove('active');
  document.getElementById('btn-zone')?.classList.remove('active');
  document.getElementById('map').classList.remove('map-drawing');
  drawTempMarkers.forEach(m=>map.removeLayer(m)); drawTempMarkers=[];
  if(drawPreviewLayer){ map.removeLayer(drawPreviewLayer); drawPreviewLayer=null; }
  document.getElementById('draw-hint-box').innerHTML='<b>선 긋기</b> — 클릭으로 점 추가, <b>더블클릭</b>으로 완성<br><b>영역 그리기</b> — 꼭짓점 추가, <b>더블클릭</b>으로 완성';
  document.getElementById('draw-tooltip').style.display='none';
}

map.on('mousemove', e=>{
  if(!drawMode) return;
  const tt=document.getElementById('draw-tooltip');
  tt.style.left=e.originalEvent.clientX+'px'; tt.style.top=e.originalEvent.clientY+'px';
  tt.textContent=drawMode==='line'
    ?(drawPoints.length===0?'시작점 클릭':`점 ${drawPoints.length}개 · 더블클릭 완성`)
    :(drawPoints.length===0?'꼭짓점 클릭':`꼭짓점 ${drawPoints.length}개 · 더블클릭 완성`);
  if(drawPoints.length>=1){
    const pts=[...drawPoints,e.latlng];
    if(drawPreviewLayer) map.removeLayer(drawPreviewLayer);
    const c=TIER_COLORS[drawTier];
    drawPreviewLayer = drawMode==='line'
      ? L.polyline(pts,{color:c,weight:4,opacity:0.45,dashArray:'6,4'}).addTo(map)
      : (pts.length>=3 ? L.polygon(pts,{color:c,weight:2,opacity:0.45,fillColor:c,fillOpacity:0.07,dashArray:'5,4'}).addTo(map) : null);
  }
});

function addDrawPoint(ll) {
  drawPoints.push(ll);
  const dot=L.circleMarker(ll,{radius:4,color:'#fff',fillColor:TIER_COLORS[drawTier],fillOpacity:1,weight:2}).addTo(map);
  drawTempMarkers.push(dot);
}
function finishDraw() {
  if(drawMode==='line'&&drawPoints.length<2){ stopDraw(); return; }
  if(drawMode==='zone'&&drawPoints.length<3){ stopDraw(); return; }
  if(drawMode==='line') {
    // 선: 이름 없이 바로 저장
    const count = places.filter(p=>p.mode==='line').length + 1;
    commitPlace(`선 ${count}`);
  } else {
    // 영역: 이름 입력 모달
    document.getElementById('pm-name').value='';
    document.getElementById('place-modal-overlay').classList.add('open');
    setTimeout(()=>document.getElementById('pm-name').focus(),80);
  }
}
function confirmPlace() {
  const name = document.getElementById('pm-name').value.trim() || `영역 ${places.filter(p=>p.mode==='zone').length+1}`;
  document.getElementById('place-modal-overlay').classList.remove('open');
  commitPlace(name);
}
function placePopupHTML(id, name) {
  return `<div class="ref-popup-inner">
    <div class="ref-popup-name">〰 ${name}</div>
    <button class="popup-del" onclick="deletePlace(${id})">삭제</button>
  </div>`;
}
function commitPlace(name) {
  const c=TIER_COLORS[drawTier], pts=[...drawPoints], mode=drawMode;
  let layer;
  if(mode==='line'){
    layer=L.polyline(pts,{color:c,weight:5,opacity:0.75,lineCap:'round',lineJoin:'round'}).addTo(map);
  } else {
    layer=L.polygon(pts,{color:c,weight:2,opacity:0.7,fillColor:c,fillOpacity:0.12}).addTo(map);
  }
  if(mode==='zone') layer.bindTooltip(name,{permanent:true,direction:'center',className:'place-label'});
  const id=nextPlaceId++;
  if(mode==='line') layer.bindPopup(placePopupHTML(id,name),{maxWidth:200});
  placeLayerMap[id]=layer;
  places.push({id,name,tier:drawTier,mode,points:pts});
  stopDraw(); renderPlacesList(); save();
}
function cancelDraw() {
  document.getElementById('place-modal-overlay').classList.remove('open');
  stopDraw();
}
function _restorePlace(pl) {
  const c=TIER_COLORS[pl.tier];
  let layer;
  if(pl.mode==='line'){
    layer=L.polyline(pl.points,{color:c,weight:5,opacity:0.75,lineCap:'round',lineJoin:'round'}).addTo(map);
    layer.bindPopup(placePopupHTML(pl.id,pl.name),{maxWidth:200});
  } else {
    layer=L.polygon(pl.points,{color:c,weight:2,opacity:0.7,fillColor:c,fillOpacity:0.12}).addTo(map);
    layer.bindTooltip(pl.name,{permanent:true,direction:'center',className:'place-label'});
  }
  placeLayerMap[pl.id]=layer;
}
function renderPlacesList() {
  const wrap=document.getElementById('places-list'); wrap.innerHTML='';
  places.forEach(p=>{
    const c=TIER_COLORS[p.tier];
    const div=document.createElement('div'); div.className='place-item';
    const ind=p.mode==='line'
      ?`<div class="place-line" style="background:${c};"></div>`
      :`<div class="place-area" style="background:${c};border:2px solid ${c};"></div>`;
    div.innerHTML=`${ind}<span class="place-name">${p.name}</span><span class="place-del" onclick="deletePlace(${p.id})">×</span>`;
    wrap.appendChild(div);
  });
}
function deletePlace(id) {
  if(!confirm('삭제할까요?')) return;
  map.removeLayer(placeLayerMap[id]); delete placeLayerMap[id];
  places=places.filter(p=>p.id!==id); renderPlacesList(); save();
}

// ══════════════════════════════
// JSON EXPORT / IMPORT
// ══════════════════════════════
function exportJSON() {
  const data={version:2, exportedAt:new Date().toISOString(),
    properties:properties.map(({id,name,lat,lng,color,deposit,rent,area,memo})=>({id,name,lat,lng,color,deposit,rent,area,memo})),
    refs:refs.map(({id,name,lat,lng,note})=>({id,name,lat,lng,note})),
    places:places.map(({id,name,tier,mode,points})=>({id,name,tier,mode,points}))};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download=`seongsu_map_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function openImport() {
  document.getElementById('import-textarea').value='';
  document.getElementById('import-status').textContent='';
  document.getElementById('import-overlay').classList.add('open');
}
function closeImport() { document.getElementById('import-overlay').classList.remove('open'); }
function importJSON() {
  const setErr=m=>{ document.getElementById('import-status').textContent=m; };
  let data;
  try{ data=JSON.parse(document.getElementById('import-textarea').value.trim()); }
  catch(e){ setErr('JSON 형식이 올바르지 않아요.'); return; }
  (data.properties||[]).forEach(p=>{ p.id=nextPropId++; properties.push(p); _addPropMarker(p); _addPropCard(p); });
  (data.refs||[]).forEach(r=>{ r.id=nextRefId++; refs.push(r); _addRefMarker(r); _addRefCard(r); });
  (data.places||[]).forEach(pl=>{ pl.id=nextPlaceId++; places.push(pl); _restorePlace(pl); });
  renderPlacesList(); save(); closeImport();
  const first=(data.properties||[])[0]||(data.refs||[])[0];
  if(first) map.flyTo([first.lat,first.lng],16,{duration:0.8});
}

// ══════════════════════════════
// KEYBOARD
// ══════════════════════════════
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); cancelDraw(); stopDraw(); closeImport(); }
  if(e.key==='Enter'&&document.getElementById('place-modal-overlay').classList.contains('open')) confirmPlace();
});

// INIT
loadAll();
</script>
</body>
</html>
